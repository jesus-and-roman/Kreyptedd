<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreyptedd — Contacts</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 480px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:none; }
  .row span.name { font-weight:600; }
  .row .actions button { width:auto; margin:0 0 0 8px; padding:6px 10px; font-size:12px; }
  .code-box { display:flex; gap:8px; }
  .code-box input { flex:1; }
  .code-box button { width:auto; margin:0; }
  h2 { font-size:14px; color:var(--text-dim); margin:24px 0 8px; text-transform:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Contacts</h1>
  <p class="sub">Ton code : <strong id="myCode">...</strong></p>

  <div class="panel">
    <div class="code-box">
      <input type="text" id="codeInput" placeholder="Code du contact (ex: A1B2C3D4)">
      <button id="addBtn">Ajouter</button>
    </div>
    <p class="error" id="errorMsg"></p>
  </div>

  <h2>Demandes reçues</h2>
  <div class="panel" id="incoming"><p class="sub">Aucune demande.</p></div>

  <h2>Mes contacts</h2>
  <div class="panel" id="contactList"><p class="sub">Aucun contact.</p></div>

  <p class="switch"><a href="app.html">Retour aux conversations</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const SUPABASE_URL = KREYPTEDD_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = KREYPTEDD_CONFIG.SUPABASE_ANON_KEY;
if (!localStorage.getItem("session_token")) window.location.href = "login.html";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
sb.auth.setSession({
  access_token: localStorage.getItem("session_token"),
  refresh_token: localStorage.getItem("session_refresh_token")
});
sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    localStorage.setItem("session_token", session.access_token);
    localStorage.setItem("session_refresh_token", session.refresh_token);
  }
});
async function getFreshToken() {
  const { data } = await sb.auth.getSession();
  return data.session?.access_token ?? localStorage.getItem("session_token");
}

function forceReLogin() {
  Object.keys(localStorage).filter(k => k.startsWith("session_")).forEach(k => localStorage.removeItem(k));
  window.location.href = "login.html";
}
async function api(path, body) {
  const token = await getFreshToken();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${path}?apikey=${SUPABASE_ANON_KEY}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${token}` },
    body: JSON.stringify(body || {})
  });
  const data = await res.json();
  if (res.status === 401) { forceReLogin(); return { ok: false, data }; }
  return { ok: res.ok, data };
}

document.getElementById("addBtn").addEventListener("click", async () => {
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  const errorMsg = document.getElementById("errorMsg");
  errorMsg.style.display = "none";
  if (!code) return;
  const { ok, data } = await api("contact-request", { code });
  if (!ok) { errorMsg.textContent = data.error || "Code invalide."; errorMsg.style.display = "block"; return; }
  document.getElementById("codeInput").value = "";
  loadAll();
});

async function respond(requestId, accept) {
  await api("contact-respond", { request_id: requestId, accept });
  loadAll();
}

async function loadAll() {
  const { data } = await api("contact-list", {});
  document.getElementById("myCode").textContent = data.my_code || "?";

  const incoming = document.getElementById("incoming");
  incoming.innerHTML = "";
  if (!data.incoming || data.incoming.length === 0) {
    incoming.innerHTML = '<p class="sub">Aucune demande.</p>';
  } else {
    data.incoming.forEach(r => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="name">${r.from_username}</span>
        <span class="actions">
          <button onclick="respond('${r.id}', true)">Accepter</button>
          <button onclick="respond('${r.id}', false)">Refuser</button>
        </span>`;
      incoming.appendChild(row);
    });
  }

  const list = document.getElementById("contactList");
  list.innerHTML = "";
  if (!data.contacts || data.contacts.length === 0) {
    list.innerHTML = '<p class="sub">Aucun contact.</p>';
  } else {
    data.contacts.forEach(c => {
      const nickKey = `kreyptedd_nickname_${c.id}`;
      const nickname = localStorage.getItem(nickKey);
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <span class="name" id="name-${c.id}">${nickname || c.username} ${nickname ? `<span class="sub" style="font-size:11px">(@${c.username})</span>` : ""}</span>
        <span class="actions"><button data-id="${c.id}" data-username="${c.username}" class="nickBtn" style="font-size:11px">Surnom</button></span>`;
      list.appendChild(row);
    });
    document.querySelectorAll(".nickBtn").forEach(btn => {
      btn.addEventListener("click", () => startNicknameEdit(btn.dataset.id, btn.dataset.username));
    });
  }
}

function startNicknameEdit(contactId, username) {
  const nickKey = `kreyptedd_nickname_${contactId}`;
  const nameSpan = document.getElementById(`name-${contactId}`);
  const current = localStorage.getItem(nickKey) || "";
  nameSpan.innerHTML = `<input type="text" id="nickInput-${contactId}" value="${current}" placeholder="${username}" style="font-size:13px;padding:4px 6px;width:140px">`;
  const input = document.getElementById(`nickInput-${contactId}`);
  input.focus();
  const save = () => {
    const value = input.value.trim();
    if (value) localStorage.setItem(nickKey, value);
    else localStorage.removeItem(nickKey);
    loadAll();
  };
  input.addEventListener("blur", save);
  input.addEventListener("keydown", e => { if (e.key === "Enter") save(); });
}
window.respond = respond;
loadAll();
</script>
</body>
</html>
